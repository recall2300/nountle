name: Fetch vocabulary list

# 국립국어원 「한국어 학습용 어휘 목록」(공공누리 제1유형)을 받아
# UTF-8 TSV(resources/vocab.tsv)로 정리해 커밋한다. 한 번만 돌리면 된다.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/fetch-vocab.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download
        run: |
          curl -fL --retry 3 -A "Mozilla/5.0" -o raw.txt \
            "https://www.korean.go.kr/common/download.do?file_path=etcData&c_file_name=b73a8438-4713-4436-8481-ec26fd0dce2a_0.txt&o_file_name=%ED%95%9C%EA%B5%AD%EC%96%B4%20%ED%95%99%EC%8A%B5%EC%9A%A9%20%EC%96%B4%ED%9C%98%20%EB%AA%A9%EB%A1%9D.txt"
          ls -la raw.txt
          file raw.txt

      - name: Normalize to UTF-8 TSV
        shell: python
        run: |
          import re, csv, sys, os
          os.makedirs("resources", exist_ok=True)
          raw = open("raw.txt", "rb").read()
          for enc in ("utf-8-sig", "cp949", "utf-16"):
              try:
                  text = raw.decode(enc); break
              except UnicodeDecodeError:
                  continue
          else:
              sys.exit("인코딩을 알 수 없음")
          print("encoding:", enc)
          lines = [l for l in text.splitlines() if l.strip()]
          for l in lines[:8]:
              print(repr(l))
          POS = {"감","고","관","대","동","명","보","부","불","수","의","형"}
          rows = []
          for l in lines:
              cells = [c.strip() for c in (l.split("\t") if "\t" in l else re.split(r"\s{2,}", l.strip()))]
              cells = [c for c in cells if c != ""]
              if len(cells) >= 3 and cells[0].isdigit() and cells[2] in POS:
                  rows.append({"순위": cells[0], "단어": cells[1], "품사": cells[2],
                               "풀이": cells[3] if len(cells) > 4 else "",
                               "등급": cells[-1] if len(cells) >= 4 else ""})
          print("parsed rows:", len(rows), "nouns:", sum(r["품사"] == "명" for r in rows))
          if len(rows) < 5000:
              sys.exit("행을 충분히 읽지 못했어요. 위 로그의 원본 형식을 확인하세요.")
          with open("resources/vocab.tsv", "w", encoding="utf-8", newline="") as f:
              w = csv.DictWriter(f, fieldnames=["순위","단어","품사","풀이","등급"], delimiter="\t")
              w.writeheader(); w.writerows(rows)
          for r in rows[:5]:
              print(r)

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/vocab.tsv
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "국립국어원 한국어 학습용 어휘 목록 추가 (공공누리 제1유형)"
          git push
