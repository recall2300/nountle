<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>명사맨틀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FBFCF8;
    --grid: #9DBFA9;
    --grid-strong: #3E7A5A;
    --ink: #20283A;
    --muted: #6E776F;
    --pen: #D0312D;
    --pen-soft: #F7E1DE;
    --serif: "Gowun Batang", "Noto Serif CJK KR", serif;
    --sans: "IBM Plex Sans KR", "Noto Sans CJK KR", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.6 var(--sans);
  }
  main { max-width: 640px; margin: 0 auto; padding: 28px 18px 64px; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--grid-strong); outline-offset: 2px; }

  /* 제목: 원고지 칸 */
  .title { display: flex; margin: 0 0 20px; font: 700 30px/1 var(--serif); }
  .title span {
    width: 1.5em; height: 1.5em; display: grid; place-items: center;
    border: 1px solid var(--grid); margin-left: -1px;
  }
  .title span:first-child { margin-left: 0; }

  /* 모드 */
  .modes { display: flex; gap: 20px; border-bottom: 1px solid var(--grid); margin-bottom: 16px; }
  .modes button {
    background: none; border: 0; padding: 6px 0 8px; cursor: pointer;
    color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .modes button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--grid-strong); }

  .hint { color: var(--muted); font-size: 14px; margin: 0 0 16px; min-height: 1.6em; }
  .hint b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* 세션 패널 */
  .session { display: none; font-size: 14px; margin-bottom: 16px; gap: 8px 16px; flex-wrap: wrap; align-items: center; }
  .session.on { display: flex; }
  .code { font-weight: 600; letter-spacing: .04em; }
  .link {
    background: none; border: 0; padding: 0; cursor: pointer;
    color: var(--grid-strong); text-decoration: underline; text-underline-offset: 3px;
  }
  .join { display: flex; gap: 6px; align-items: center; }
  .join input {
    width: 9em; padding: 4px 8px; border: 1px solid var(--grid); background: #fff; border-radius: 2px;
  }

  /* 입력: 원고지 */
  form.guess { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
  .sheet {
    --cell: 1.5em;
    font: 400 clamp(18px, 5.2vw, 26px)/1 var(--serif);
    width: calc(var(--cell) * 8 + 2px);
    height: calc(var(--cell) + 2px);
    padding: 0 0 0 .25em;
    letter-spacing: .5em;
    border: 1px solid var(--grid-strong);
    border-radius: 0;
    background-color: #fff;
    background-image: linear-gradient(to right, var(--grid) 1px, transparent 1px);
    background-size: var(--cell) 100%;
    background-position: calc(var(--cell) - 1px) 0;
    outline-offset: 3px;
  }
  .sheet::placeholder { color: #B5C4B9; }
  .go {
    padding: 0 20px; border: 0; border-radius: 2px; cursor: pointer;
    background: var(--grid-strong); color: #fff; font-weight: 600; min-height: 44px;
  }
  .go:disabled { opacity: .5; cursor: default; }
  .msg { min-height: 1.6em; margin: 8px 0 4px; font-size: 14px; color: var(--pen); }

  /* 정답 배너 */
  .done { display: none; margin: 8px 0 16px; padding: 14px 16px; border-left: 3px solid var(--pen); background: var(--pen-soft); }
  .done.on { display: block; }
  .done p { margin: 0 0 6px; }
  .done .answer { font: 700 22px/1.3 var(--serif); }

  /* 추측 표 */
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th {
    text-align: left; font-weight: 500; font-size: 13px; color: var(--muted);
    padding: 6px 8px; border-bottom: 1px solid var(--grid-strong);
  }
  td { padding: 9px 8px; border-bottom: 1px solid #E3ECE5; vertical-align: middle; }
  th.n, td.n { width: 3em; color: var(--muted); text-align: right; }
  th.s, td.s { width: 5.5em; text-align: right; }
  th.r, td.r { width: 38%; }
  td.w { font: 400 19px/1.3 var(--serif); }
  tr.latest td { background: #EEF5F0; }
  tr.latest + tr.gap td { height: 10px; padding: 0; border-bottom: 1px solid var(--grid-strong); }
  @keyframes flash { from { background: #D6E8DC; } to { background: transparent; } }
  tr.flash td { animation: flash .9s ease-out; }

  .rank { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .rank .bar { flex: 1; height: 4px; background: #EAEFEB; position: relative; }
  .rank .bar i { position: absolute; inset: 0 auto 0 0; background: var(--pen); }
  .rank .t { width: 4.6em; text-align: right; white-space: nowrap; }
  .rank.out { color: var(--muted); }

  /* 정답에는 빨간 동그라미 */
  .circled { position: relative; display: inline-block; padding: 0 .1em; }
  .circled::after {
    content: ""; position: absolute; inset: -.3em -.45em;
    border: 2px solid var(--pen); border-radius: 50%;
    transform: rotate(-5deg);
  }
  .rank.hit { color: var(--pen); font-weight: 600; }

  .empty { color: var(--muted); padding: 28px 8px; text-align: center; }
  .foot { margin-top: 20px; display: flex; justify-content: space-between; font-size: 14px; }
  .giveup { color: var(--muted); }

  .top { display: none; margin-top: 12px; }
  .top.on { display: block; }
  .top ol { columns: 2; column-gap: 24px; padding-left: 2.6em; margin: 8px 0 0; font-size: 15px; }
  .top li { break-inside: avoid; }
  .top li span { color: var(--muted); font-size: 13px; margin-left: 4px; font-variant-numeric: tabular-nums; }

  @media (max-width: 420px) {
    th.r, td.r { width: 34%; }
    .rank .bar { display: none; }
    .top ol { columns: 1; }
  }
  @media (prefers-reduced-motion: reduce) { tr.flash td { animation: none; } }
</style>
</head>
<body>
<main>
  <h1 class="title" aria-label="명사맨틀"><span>명</span><span>사</span><span>맨</span><span>틀</span></h1>

  <nav class="modes" role="tablist">
    <button role="tab" data-mode="daily" aria-selected="true">오늘의 단어</button>
    <button role="tab" data-mode="session" aria-selected="false">무제한</button>
  </nav>

  <div class="session" id="session">
    <span>참여 코드 <span class="code" id="code">-</span></span>
    <button class="link" id="copy" type="button">복사</button>
    <button class="link" id="new" type="button">새 문제</button>
    <form class="join" id="join">
      <input id="joinCode" placeholder="친구 코드" autocomplete="off" aria-label="친구의 참여 코드">
      <button class="link" type="submit">참여</button>
    </form>
  </div>

  <p class="hint" id="hint"></p>

  <form class="guess" id="guess">
    <input class="sheet" id="word" maxlength="8" placeholder="명사" autocomplete="off"
           autocapitalize="off" spellcheck="false" aria-label="추측할 명사">
    <button class="go" id="go" type="submit">추측</button>
  </form>
  <p class="msg" id="msg" role="status"></p>

  <section class="done" id="done">
    <p id="doneText"></p>
    <p class="answer" id="answer"></p>
    <button class="link" id="showTop" type="button">가까운 단어 100개 보기</button>
    <div class="top" id="top"><ol id="topList"></ol></div>
  </section>

  <table>
    <thead><tr><th class="n">#</th><th>단어</th><th class="s">유사도</th><th class="r">순위</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <div class="foot">
    <span id="count"></span>
    <button class="link giveup" id="giveup" type="button">포기하고 정답 보기</button>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const TOP_N = 1000;
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let state = { mode: "daily", sid: null, date: null, guesses: new Map(), latest: null, solved: false, gaveUp: false };
let pollTimer = null;

const base = () => state.mode === "daily" ? "/api/daily" : `/api/session/${state.sid}`;
const dailyKey = () => `nountle:daily:${state.date}`;

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || "서버에 연결하지 못했어요. 잠시 뒤 다시 시도해 주세요.");
  return body;
}

function saveDaily() {
  if (state.mode !== "daily") return;
  store.set(dailyKey(), { guesses: [...state.guesses.values()], solved: state.solved, gaveUp: state.gaveUp });
}

function addGuess(g) {
  if (!g.order) g.order = state.guesses.size + 1;
  state.guesses.set(g.word, g);
  if (g.correct) state.solved = true;
}

/* ---------- 화면 그리기 ---------- */
function rankCell(g) {
  const wrap = document.createElement("div");
  wrap.className = "rank";
  const t = document.createElement("span");
  t.className = "t";
  if (g.correct) {
    wrap.classList.add("hit"); t.textContent = "정답";
  } else if (g.rank) {
    const bar = document.createElement("span");
    bar.className = "bar";
    const fill = document.createElement("i");
    const p = (TOP_N + 1 - g.rank) / TOP_N;
    fill.style.width = `${p * 100}%`;
    fill.style.opacity = (0.35 + 0.65 * p).toFixed(2);
    bar.append(fill);
    wrap.append(bar);
    t.textContent = `${g.rank}위`;
  } else {
    wrap.classList.add("out"); t.textContent = `${TOP_N}위 밖`;
  }
  wrap.append(t);
  return wrap;
}

function row(g, cls) {
  const tr = document.createElement("tr");
  if (cls) tr.className = cls;
  const n = document.createElement("td"); n.className = "n"; n.textContent = g.order;
  const w = document.createElement("td"); w.className = "w";
  if (g.correct) { const c = document.createElement("span"); c.className = "circled"; c.textContent = g.word; w.append(c); }
  else w.textContent = g.word;
  const s = document.createElement("td"); s.className = "s"; s.textContent = g.similarity.toFixed(2);
  const r = document.createElement("td"); r.className = "r"; r.append(rankCell(g));
  tr.append(n, w, s, r);
  return tr;
}

function render(flash) {
  const rows = $("rows");
  rows.replaceChildren();
  const list = [...state.guesses.values()].sort((a, b) => b.similarity - a.similarity);
  if (!list.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 4; td.className = "empty";
    td.textContent = "떠오르는 명사를 아무거나 넣어 보세요. 유사도가 높을수록 정답에 가까워요.";
    tr.append(td); rows.append(tr);
  } else {
    const latest = !(state.solved || state.gaveUp) && state.latest && state.guesses.get(state.latest);
    if (latest) {
      rows.append(row(latest, "latest" + (flash ? " flash" : "")));
      const gap = document.createElement("tr"); gap.className = "gap";
      gap.innerHTML = '<td colspan="4"></td>'; rows.append(gap);
    }
    list.forEach((g) => rows.append(row(g)));
  }
  $("count").textContent = list.length ? `${list.length}번 추측했어요` : "";

  const over = state.solved || state.gaveUp;
  $("done").classList.toggle("on", over);
  $("giveup").hidden = over || !list.length;
  $("word").disabled = over; $("go").disabled = over;
  if (over) {
    const correct = list.find((g) => g.correct);
    $("doneText").textContent = state.gaveUp && !correct
      ? "정답은 이 단어였어요."
      : `정답이에요. ${correct ? correct.order : list.length}번 만에 맞혔어요.`;
    $("answer").textContent = state.answer || (correct && correct.word) || "";
  } else {
    $("top").classList.remove("on");
  }
}

/* ---------- 동작 ---------- */
async function loadHint() {
  $("hint").textContent = "";
  try {
    const h = await api(`${base()}/hint`);
    const far = h[`rank${TOP_N}`];
    $("hint").innerHTML = "";
    $("hint").append(
      "가장 가까운 단어의 유사도는 ", Object.assign(document.createElement("b"), { textContent: h.rank1.toFixed(2) }),
      ", 10번째는 ", Object.assign(document.createElement("b"), { textContent: h.rank10.toFixed(2) }),
      `, ${TOP_N}번째는 `, Object.assign(document.createElement("b"), { textContent: far.toFixed(2) }), "예요."
    );
    return h;
  } catch (e) { $("msg").textContent = e.message; }
}

async function startDaily() {
  stopPoll();
  state = { ...state, mode: "daily", sid: null, guesses: new Map(), latest: null, solved: false, gaveUp: false, answer: null };
  const h = await loadHint();
  state.date = h && h.date;
  const saved = state.date && store.get(dailyKey());
  if (saved) {
    saved.guesses.forEach(addGuess);
    state.solved = saved.solved; state.gaveUp = saved.gaveUp;
    if (state.gaveUp) { try { state.answer = (await api(`${base()}/giveup`)).answer; } catch {} }
  }
  render();
}

async function startSession(sid) {
  stopPoll();
  $("msg").textContent = "";
  try {
    if (!sid) sid = (await api("/api/session", { method: "POST" })).session_id;
    state = { ...state, mode: "session", sid, guesses: new Map(), latest: null, solved: false, gaveUp: false, answer: null };
    await syncSession();
    store.set("nountle:sid", sid);
    $("code").textContent = sid;
    await loadHint();
    render();
    pollTimer = setInterval(syncSession, 4000);
  } catch (e) {
    $("msg").textContent = e.message;
    if (sid) { store.set("nountle:sid", null); }
    throw e;
  }
}

async function syncSession() {
  if (state.mode !== "session") return;
  const { guesses } = await api(`${base()}/guesses`);
  const before = state.guesses.size;
  guesses.forEach(addGuess);
  if (state.guesses.size !== before) render();
}

function stopPoll() { if (pollTimer) clearInterval(pollTimer); pollTimer = null; }

async function guess(word) {
  word = word.trim().replace(/\s+/g, "");
  if (!word) return;
  $("msg").textContent = "";
  if (state.guesses.has(word)) {
    state.latest = word; render(true);
    $("msg").textContent = `'${word}'은(는) 이미 넣은 단어예요.`;
    return;
  }
  $("go").disabled = true;
  try {
    const g = await api(`${base()}/guess?word=${encodeURIComponent(word)}`);
    addGuess(g);
    state.latest = g.word;
    saveDaily();
    render(true);
    $("word").value = "";
  } catch (e) {
    $("msg").textContent = e.message;
  } finally {
    if (!state.solved) $("go").disabled = false;
    $("word").focus();
  }
}

async function showTop() {
  const top = $("top");
  if (top.classList.toggle("on") && !$("topList").children.length) {
    try {
      const data = await api(`${base()}/giveup`);
      $("topList").replaceChildren(...data.top.map((t) => {
        const li = document.createElement("li");
        li.textContent = t.word;
        const s = document.createElement("span"); s.textContent = t.similarity.toFixed(2);
        li.append(s); return li;
      }));
    } catch (e) { $("msg").textContent = e.message; }
  }
}

/* ---------- 이벤트 ---------- */
$("guess").addEventListener("submit", (e) => { e.preventDefault(); guess($("word").value); });
$("giveup").addEventListener("click", async () => {
  if (!confirm("포기하면 정답이 공개돼요. 포기할까요?")) return;
  try {
    const data = await api(`${base()}/giveup`);
    state.gaveUp = true; state.answer = data.answer;
    saveDaily(); render();
  } catch (e) { $("msg").textContent = e.message; }
});
$("showTop").addEventListener("click", showTop);
$("new").addEventListener("click", () => { $("topList").replaceChildren(); startSession(); });
$("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(state.sid); $("msg").textContent = "참여 코드를 복사했어요."; }
  catch { $("msg").textContent = `참여 코드: ${state.sid}`; }
});
$("join").addEventListener("submit", (e) => {
  e.preventDefault();
  const code = $("joinCode").value.trim();
  if (code) { $("topList").replaceChildren(); startSession(code).then(() => { $("joinCode").value = ""; }, () => {}); }
});
document.querySelectorAll(".modes button").forEach((b) => b.addEventListener("click", async () => {
  if (b.dataset.mode === state.mode) return;
  document.querySelectorAll(".modes button").forEach((x) => x.setAttribute("aria-selected", x === b));
  $("session").classList.toggle("on", b.dataset.mode === "session");
  $("topList").replaceChildren(); $("msg").textContent = "";
  if (b.dataset.mode === "daily") startDaily();
  else startSession(store.get("nountle:sid")).catch(() => startSession());
}));

startDaily();
</script>
</body>
</html>
